<!DOCTYPE html>

    <style>

        header {

            padding: 20px;
            margin: 10px;
            border: 2px solid #DAC8AE;

            text-align: center;
        }

        .content {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;

        .main-content {

            background-color: #EFDECD;

            margin: 10px;
            border: 2px solid #DAC8AE;

        footer {
            background-color: #EFDECD;
            padding: 20px;
            margin: 10px;
            border: 2px solid #DAC8AE;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }

        .content-body {
            font-size: 22px;
            color: #5C4033;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            display: inline;
            margin: 15px;
            font-size: 20px;
        }

        input, textarea {

                    <input type="text" id="name" required><br><br>

                    <label for="email">Email:</label><br>

                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" required><br><br>

                    <label for="message">Message:</label><br>
                    <textarea id="message" required></textarea><br><br>
