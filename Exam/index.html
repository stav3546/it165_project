<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Alert</title>

<style>
    body{
    margin:0;
    text-align:center;
    font-family:Arial, sans-serif;
    background:#EFDECD;
    }

    header{
    background:#DAC8AE;
    padding:30px;
    }

    h1{
    color:#9F8170;
    }

    button{
    margin:15px;
    padding:12px 25px;
    background:#9F8170;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    }
</style>

</head>
<body>

<header>
    <h1>JavaScript Alert</h1>
</header>

<br><br>

<button onclick="alert('You have clicked Left Button')">Left</button>
<button onclick="alert('You have clicked Middle Button')">Middle</button>
<button onclick="alert('You have clicked Right Button')">Right</button>

</body>
</html>
